<!--
  cc-viz — Font Loader Snippets

  HOW TO USE:
  1. Pick a pairing from references/libraries.md (the 16-row table).
  2. Copy the PRECONNECT block once into your <head>.
  3. Copy ONE pairing block (or two — body pairing + the Satoshi add-on if your
     pairing specifies Satoshi as body) into your <head>.
  4. Apply the suggested :root variables (shown as a CSS comment in each block).

  Notes:
  - All pairings here ship from Google Fonts EXCEPT Satoshi (Fontshare).
  - "display=swap" means the page renders with fallback fonts immediately,
    then swaps in the real font on load. No FOIT.
  - Display serifs (Instrument Serif, Playfair, Fraunces, Crimson Pro) load
    both regular and italic via ital@0;1.
  - Body fonts default to weights 400/500/600/700. Monos default to 400/500.
  - Numbered to match the order in references/libraries.md.
  - Pairings 14/15/16 (Source Serif 4 / Lora / Newsreader) are reading
    serifs — the strongest "this is a document, not a landing page" signal.
-->


<!-- =============================================================
     PRECONNECT — include once, regardless of pairing.
     ============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<!-- =============================================================
     PAIRING 1/16 — DM Sans + Fira Code
     Feel: Technical, precise.  Use for: Blueprint, technical docs.
     ============================================================= -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<!-- :root {
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'Fira Code', 'SF Mono', Consolas, monospace;
} -->

<!--
  PAIRINGS REQUIRING A SECOND BODY-FONT BLOCK:
    Pairings 2, 9, 13 are display + mono only.
    Add a sans body block (typically pairing 1, 3, or 5) alongside.

  EXAMPLE — pairing 2 (Instrument Serif display) + pairing 1 (DM Sans body):

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  Combine families with `&family=` in the URL — one request, many fonts.
-->
